<!DOCTYPE html>
<html lang="it">
<head>
    <title>Le mie ricette</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🍽️MealBook</h1>
        <div>
            <input type="text" placeholder="Cerca una ricetta...">
            <button>Cerca</button>
        </div>
    </header>

    <main>
        <div="griglia">
            <div class="card">
                <img src="./Mockup Esercizio — Pagina Ricette_files/Chicken_Tikka_Masala.jpg" alt="Chicken Tikka Masala">
                <div class="class-body">
                    <h3>Chicken Tikka Masala</h3>
                    <span class="badge-categoria-cibo">🏷️ Chicken</span>
                    <span class="badge-area">🌍 Indian</span>
                    <br>
                    <button>Vedi ricetta →</button>
                </div>
            </div>
            
            <div class="card">
                <img src="./Mockup Esercizio — Pagina Ricette_files/Spaghetti_Carbonara.jpg" alt="Spaghetti Carbonara">
                <div class="class-body">
                    <h3>Spaghetti Carbonara</h3>
                    <span class="badge-categoria-cibo">🏷️ Pasta</span>
                    <span class="badge-area">🌍 Italian</span>
                    <br>
                    <button>Vedi ricetta →</button>
                </div>
            </div>

            <div class="card">
                <img src="./Mockup Esercizio — Pagina Ricette_files/Salmon_Nigiri.jpg" alt="Salmon_Nigiri">
                <div class="class-body">
                    <h3>Salmon Nigiri</h3>
                    <span class="badge-categoria-cibo">🏷️ Seafood</span>
                    <span class="badge-area">🌍 Japanese</span>
                    <br>
                    <button>Vedi ricetta →</button>
                </div>
            </div>

        </div>
    </main>

    <footer>
    </footer>
</body>
</html>
